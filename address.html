<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadexCrafts</title>
        <link rel="shortcut icon" href="Assets/img/favicon.jpg" type="image/x-icon">
    <link rel="stylesheet" href="Assets/css/style.css">
    <link rel="stylesheet" href="Assets/css/Common/slide-menu.css">
    <link rel="stylesheet" href="Assets/css/Common/navbar.css"> 
    <link rel="stylesheet" href="Assets/css/Pages-style/checkout.css">
    <link rel="stylesheet" href="Assets/css/Pages-style/cart.css"> 
    <link rel="stylesheet" href="Assets/css/Pages-style/product-page.css" >
</head>
<body> 
 <div class="navbar-links"></div>
 <div id="navigation-bar"></div>
    <div class="payment">
    <div class="cartt">
        <div class="heading"><p>Shipping Details</p></div>
        <div class="products-and-details">
            <div class="cart-product">
                <div class="cart-product-image">
                    <img src="Assets/img/product-1.jpg" alt="" class="cart-product-img" width="100%">
                </div>
                <div class="cart-product-details">
                    <div class="cart-product-title">
                        <p ><span style="font-family: degular-medium;">ReadexCrafts</span> <br>Adjustable Quran Stand</p> 
                    </div>
                    
                    <div class="cart-product-price">
                        <p><span class="price" style=" font-size: 14px;">₹<span style="font-family: Degular-semibold; font-size: 17.5px;" class="total-amount">3950</span></span></p>
                        <img src="Assets/img/Free shipping.svg">                    
                    </div>
                </div>
            </div><hr class="hrl" style="margin: 24px 0px 12px 0px;">
        </div>
    </div>


    <div class="shippingdetails">
        <div class="section">
            
            <input type="text" name="" id="name" placeholder="Name" class="form-control">
            <textarea class="form-control" placeholder="Address" rows="3" id="address"></textarea>
        
            <input type="text" name="" id="pincode" placeholder="Pin code">
            <div class="form-group">
                <input type="text" class="form-control" id="country" placeholder="Country">
                <div class="suggestions" id="countrySuggestions"></div>
            </div>
            <div class="form-group">
                <input type="text" class="form-control" id="state" placeholder="State">
                <div class="suggestions" id="stateSuggestions"></div>
            </div>
            <div class="form-group phone-input">
                <input type="text" class="form-control country-code no-spinner" id="countryCode" placeholder="+91" inputmode="numeric" pattern="[0-9]*" style="appearance: textfield; -webkit-appearance: none; -moz-appearance: textfield;">
                <input type="tel" id="number" class="form-control" placeholder="Mobile Number" >
               <div class="flag-condainer"> <img src="Assets/contry/in.svg" alt="" class="country-flag" id="countryFlag"></div>
            </div>
            <div class="white" style="margin-top: 10px;"></div>
            <!-- <div class="white"></div> -->
            <div class="chekout-cart-div">
                <div class="buy-now-btn">
                    <button id="buyNow" class="buy-now-content" style="height: 59px; ">Payment <img src="Assets/icons/Button-arrow-right.png" width="26px"></button>
                </div>
            </div>
        </div>
    </div>
    </div>

<script src="js/loadPartials.js"></script>
<script src="js/navbar.js"></script>
<script src="js/shipping-detail.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
<script src="js/payment.js" type="module"></script>
<script>
 document.addEventListener('DOMContentLoaded', function() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length === 0) {
                alert('Your cart is empty. Please add items to the cart before proceeding to checkout.');
                window.location.href = 'cart.html'; // Redirect to cart page
            }else{
                document.querySelector('.total-amount').textContent = cart[0].price*cart[0].quantity - cart[0].discount*cart[0].quantity;
            }
        });

</script>
<script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
</body></html>
